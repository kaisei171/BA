<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACK APRON 過去問</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#193c30;background:#f1f6f3}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:auto;padding:16px}header{background:#075b42;color:white;padding:22px;border-radius:15px}h1{margin:0;font-size:23px}a{color:#0b6547}.panel{background:white;border-radius:13px;padding:19px;margin-top:14px;box-shadow:0 2px 10px #1532}button,select{font:inherit;border-radius:9px;padding:11px}button{border:0;background:#086143;color:white;cursor:pointer;font-weight:650}button.secondary{background:#e4efe8;color:#14533d}button:disabled{opacity:.5;cursor:default}.flex{display:flex;gap:10px;flex-wrap:wrap}.flex>*{flex:1}select{width:100%;border:1px solid #bacbc2;background:white}label{font-size:13px}h2{white-space:pre-wrap;line-height:1.65;font-size:19px}.option{width:100%;text-align:left;background:#f6f9f7;color:#183c30;border:1px solid #cad9d0;margin:6px 0;line-height:1.55;white-space:pre-wrap;font-weight:400}.option.chosen{background:#d9ebdf;border:2px solid #0b7850}.option.right{border:2px solid #0c8c52;background:#e5f6ea}.option.wrong{border:2px solid #c75050;background:#fff0f0}.muted{color:#65786e;font-size:13px}.result{padding:13px;border-radius:8px;background:#eaf7ed;margin-top:12px}.hidden{display:none!important}img{max-width:100%;height:auto;display:block;margin:8px 0;border-radius:6px}.tag{display:inline-block;background:#e1eee6;padding:5px 9px;border-radius:5px;font-size:12px}#progress{height:9px;border-radius:8px;background:#e5eee8;overflow:hidden}#progress>div{height:100%;background:#0c9861;width:0}#question{min-height:40px}@media(max-width:500px){main{padding:9px}.panel{padding:13px}h2{font-size:17px}}
</style></head><body><main><header><h1>☕ BLACK APRON 過去問モード</h1><p>FY24・FY25・FY26｜各50問｜全150問</p><a href="index.html" style="color:white">← 通常の学習モードに戻る</a></header>
<section class="panel"><div class="flex"><label>受験モード<select id="year"><option value="FY24">FY24（50問）</option><option value="FY25">FY25（50問）</option><option value="FY26">FY26（50問）</option><option value="all">過去3年ランダム（150問）</option></select></label><label>出題順<select id="order"><option value="ordered">問題番号順</option><option value="random">ランダム</option></select></label></div><div class="flex" style="margin-top:12px"><button id="start">この条件で開始</button><button class="secondary" id="retry">間違えた問題だけ</button></div><p class="muted" id="summary"></p><div id="progress"><div id="bar"></div></div></section>
<section class="panel"><div class="muted" id="position"></div><h2 id="question"></h2><div id="picture"></div><p class="tag" id="kind"></p><div id="choices"></div><div class="flex" style="margin-top:12px"><button id="submit">解答する</button><button id="next" class="secondary hidden">次の問題 →</button></div><div id="result" class="result hidden"></div></section>
<section class="panel"><p class="muted">解答はPDF内の黄色い正解欄から読み取っています。選択肢の文字配置や画像に読み取り誤りが残る場合があります。複数選択問題はすべて選んでから「解答する」を押してください。解答履歴はブラウザに保存されます。</p><div class="flex"><button class="secondary" id="export">過去問の成績を保存</button><label>成績を復元 <input type="file" id="import" accept=".json,application/json"></label></div></section></main><script src="past_questions.js"></script><script>
(()=>{const all=window.PAST_EXAM_QUESTIONS||[],$=id=>document.getElementById(id),key='blackApronPastExamV1';let records={},seq=[],idx=0,chosen=new Set(),done=false;try{records=JSON.parse(localStorage.getItem(key)||'{}')}catch{}function save(){localStorage.setItem(key,JSON.stringify(records))}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(incorrectOnly=false){let year=$('year').value;seq=all.filter(q=>(year==='all'||q.year===year)&&(!incorrectOnly||records[q.id]?.correct===false));if(year==='all'||$('order').value==='random')shuffle(seq);idx=0;render()}function render(){chosen=new Set();done=false;const q=seq[idx];$('result').classList.add('hidden');$('next').classList.add('hidden');$('submit').classList.remove('hidden');$('picture').innerHTML='';$('choices').innerHTML='';$('bar').style.width=(seq.length?100*idx/seq.length:0)+'%';const vals=Object.values(records),correct=vals.filter(x=>x.correct).length;$('summary').textContent=`過去問の記録：${vals.length}問解答済み／${correct}問正解`;if(!q){$('position').textContent='';$('question').textContent=seq.length?'このモードは終了しました。お疲れさまでした！':'該当する問題がありません';$('kind').textContent='';$('submit').classList.add('hidden');$('bar').style.width='100%';return}$('position').textContent=`${idx+1} / ${seq.length}｜${q.year} 第${q.number}問｜PDF ${q.page}ページ`;$('question').textContent=q.question;$('kind').textContent=q.multiple?'複数選択（該当するものをすべて選択）':'単一選択';if(q.image){let im=document.createElement('img');im.src=q.image;im.alt='問題の図';$('picture').append(im)}q.options.forEach((s,i)=>{if(!s)return;let b=document.createElement('button');b.className='option';b.textContent=`${i+1}. ${s}`;b.onclick=()=>{if(done)return;if(!q.multiple)chosen.clear();if(chosen.has(i+1))chosen.delete(i+1);else chosen.add(i+1);update()};b.dataset.n=i+1;$('choices').append(b)});update()}function update(){document.querySelectorAll('.option').forEach(b=>b.classList.toggle('chosen',chosen.has(Number(b.dataset.n))))}function submit(){if(done||!seq[idx]||!chosen.size){if(!chosen.size)alert('選択肢を選んでください');return}let q=seq[idx],right=[...q.correct].sort().join(','),got=[...chosen].sort().join(','),correct=right===got;records[q.id]={correct,selected:[...chosen],date:new Date().toISOString()};save();done=true;document.querySelectorAll('.option').forEach(b=>{let n=Number(b.dataset.n);if(q.correct.includes(n))b.classList.add('right');else if(chosen.has(n))b.classList.add('wrong')});$('result').classList.remove('hidden');$('result').textContent=(correct?'⭕ 正解！':'❌ 不正解')+' 正解：'+q.correct.join('・')+'番'+(q.correct.length?'（'+q.correct.map(n=>q.options[n-1]).join(' ／ ')+'）':'（原本で要確認）');$('submit').classList.add('hidden');$('next').classList.remove('hidden')}$('start').onclick=()=>start(false);$('retry').onclick=()=>start(true);$('submit').onclick=submit;$('next').onclick=()=>{idx++;render()};$('export').onclick=()=>{let b=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='past_exam_progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.records||typeof x.records!=='object')throw Error('形式不正');records=x.records;save();start();alert('復元しました')}catch(err){alert(err.message)}};start()})();
</script></body></html>
