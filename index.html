<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACK APRON STUDY</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#18352d;background:#f2f6f4}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px}header{background:#075b42;color:white;padding:22px;border-radius:16px;margin-bottom:14px}h1{margin:0;font-size:24px}header p{margin:5px 0 0;font-size:13px}.panel{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #1232}h2{font-size:19px;line-height:1.8;white-space:pre-wrap}.muted{color:#65766e;font-size:13px}.stats{display:flex;justify-content:space-around;gap:8px;text-align:center}.stats strong{display:block;font-size:23px}.stats small{font-size:11px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls label{flex:1;min-width:125px;font-size:13px}select{display:block;width:100%;padding:10px;border:1px solid #b7c8c0;border-radius:8px;background:white}button{cursor:pointer;background:#075b42;color:white;border:0;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:600}button.secondary{background:#e7efeb;color:#174c3b}button.danger{background:#b33e3e}button:disabled{opacity:.5;cursor:default}.buttons{display:flex;gap:9px;flex-wrap:wrap}.buttons button{flex:1}.answer{padding:18px;border-left:4px solid #075b42;background:#eff8f3;white-space:pre-wrap;margin:14px 0;line-height:1.8}.question{min-height:260px}.note{background:#fff7df;border-radius:8px;padding:12px;font-size:13px;line-height:1.7}.progress{height:8px;background:#e6eae8;border-radius:8px;overflow:hidden;margin-top:14px}.progress span{display:block;background:#168c62;height:100%;width:0}.hidden{display:none!important}#message{font-size:13px;color:#075b42;margin-top:10px}input[type=file]{max-width:100%}@media(max-width:480px){main{padding:10px}h2{font-size:17px}button{font-size:14px;padding:12px 10px}}
</style></head><body><main><header><h1>☕ BLACK APRON STUDY</h1><p>自分で考える → 答えを見る → 自分で正誤を判定</p></header><section class="panel"><div class="stats"><div><strong id="total">0</strong><small>登録問題</small></div><div><strong id="mastered">0</strong><small>正解済み</small></div><div><strong id="percent">0%</strong><small>正解率</small></div><div><strong id="reviewCount">0</strong><small>要確認</small></div></div><div class="progress"><span id="bar"></span></div><p class="muted" id="history"></p></section><section class="panel controls"><label>出題順<select id="mode"><option value="ordered">教材順</option><option value="random">ランダム</option><option value="review">要確認のみ</option></select></label><label>年度<select id="year"><option value="all">両年度</option><option value="FY2026">FY2026</option><option value="FY2027">FY2027</option></select></label><button class="secondary" id="restart">最初から</button></section><section class="panel question"><p id="position" class="muted"></p><h2 id="question"></h2><div id="answer" class="answer" hidden></div><button id="reveal">答えを見る</button><div id="grading" hidden><p class="muted">自分の答えと見比べて判定してください</p><div class="buttons"><button id="incorrect" class="danger">不正解</button><button id="correct">正解</button></div><button id="flag" class="secondary" style="margin-top:10px;width:100%">正解だけど要確認</button></div><button id="next" class="secondary" hidden>次の問題 →</button><p id="message"></p></section><section class="panel"><p class="note">この問題集はPDFから機械的に抽出した<strong>未検証の候補</strong>です。模範解答の誤対応が残る可能性があります。疑わしい問題は元のPDFで確認してください。</p><p class="muted">進捗はこのブラウザ内に保存されます。別端末への引き継ぎはバックアップを使ってください。</p><div class="buttons"><button class="secondary" id="export">進捗バックアップ保存</button><label style="align-self:center">復元 <input type="file" id="restore" accept="application/json,.json"></label></div></section></main><script src="questions.js"></script><script>
(()=>{'use strict';const all=window.STUDY_QUESTIONS||[],$=id=>document.getElementById(id),key='blackApronStudySelfGradeV1';let records={},seq=[],idx=0,graded=false;try{records=JSON.parse(localStorage.getItem(key)||'{}')}catch{};function save(){localStorage.setItem(key,JSON.stringify(records))}function stats(){const values=Object.values(records);const correct=values.filter(x=>x.result==='correct').length,review=values.filter(x=>x.review).length,answered=values.filter(x=>x.result).length;$('total').textContent=all.length;$('mastered').textContent=correct;$('reviewCount').textContent=review;$('percent').textContent=answered?Math.round(correct/answered*100)+'%':'0%';$('bar').style.width=(answered?correct/answered*100:0)+'%';$('history').textContent=`判定済み ${answered}問 / 全${all.length}問（正解率は判定済み問題に対する割合）`}function build(){const y=$('year').value,m=$('mode').value;seq=all.filter(q=>(y==='all'||q.year===y)&&(m!=='review'||records[q.id]?.review));if(m==='random'){for(let i=seq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]]}}idx=0;render()}function render(){stats();const q=seq[idx];$('answer').hidden=true;$('grading').hidden=true;$('next').hidden=true;$('reveal').hidden=!q;$('message').textContent='';graded=false;if(!q){$('position').textContent='';$('question').textContent=seq.length?'この条件の問題はすべて終了しました':'この条件に該当する問題はありません';return}$('position').textContent=`${idx+1} / ${seq.length}｜${q.year}｜PDF ${q.page}ページ`;$('question').textContent=q.question;$('answer').textContent=q.answer;$('flag').textContent='正解だけど要確認'}function grade(result,review){const q=seq[idx];if(!q||graded)return;records[q.id]={result,review,date:new Date().toISOString()};save();graded=true;$('grading').hidden=true;$('next').hidden=false;$('message').textContent=review?'要確認リストに追加しました':result==='correct'?'正解として記録しました':'不正解として記録しました';stats()}$('reveal').onclick=()=>{if(!seq[idx])return;$('answer').hidden=false;$('reveal').hidden=true;$('grading').hidden=false};$('correct').onclick=()=>grade('correct',false);$('incorrect').onclick=()=>grade('incorrect',true);$('flag').onclick=()=>grade('correct',true);$('next').onclick=()=>{idx++;render()};$('restart').onclick=build;$('year').onchange=build;$('mode').onchange=build;$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='black_apron_progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.records||typeof data.records!=='object')throw Error('形式が違います');if(!confirm('現在の進捗をバックアップの内容で置き換えますか？'))return;records=data.records;save();build();alert('復元しました')}catch(err){alert('復元できませんでした: '+err.message)}};build()})();
</script></body></html>
